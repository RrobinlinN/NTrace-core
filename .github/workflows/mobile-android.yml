name: Mobile Android

# Builds the Android shell app (mobile/android) around the NextTrace binary.
# Fork-only workflow: it lives on the `mobile` branch and never runs upstream.

on:
  workflow_dispatch:
  push:
    branches: [mobile]
    paths-ignore:
      - "mobile/ios/**"
      - ".github/workflows/mobile-ios.yml"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "26"
  RELEASE_TAG: android-latest

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test unprivileged probe decoding
        run: go test ./trace/internal/ -run 'SockExtendedErr|Synthetic' -count=1

      - name: Resolve build metadata
        run: |
          set -Eeuo pipefail
          echo "BUILD_VERSION=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "COMMIT_SHA1=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build NextTrace for android/arm64
        run: |
          set -Eeuo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "Android NDK not found on this runner" >&2
            exit 1
          fi
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$CC"
          OUT=mobile/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          LD_FLAGS="-X github.com/nxtrace/NTrace-core/config.Version=${BUILD_VERSION} \
                    -X github.com/nxtrace/NTrace-core/config.BuildDate=${BUILD_DATE} \
                    -X github.com/nxtrace/NTrace-core/config.CommitID=${COMMIT_SHA1} \
                    -w -s"
          # The executable is named lib*.so so the APK installer extracts it to
          # nativeLibraryDir, where the app is allowed to exec it.
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags "$LD_FLAGS" -o "$OUT/libnexttrace.so" .
          file "$OUT/libnexttrace.so"
          ls -l "$OUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -n "${ANDROID_KEYSTORE_B64}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "Using the repository signing key."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set; signing with a throwaway debug key."
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          APP_VERSION_NAME: ${{ env.BUILD_VERSION }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace assembleRelease
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NextTrace-android-arm64.apk"
          unzip -l "$GITHUB_WORKSPACE/NextTrace-android-arm64.apk" | grep -E 'lib/|AndroidManifest'
          # Print the signer so a key change (which blocks in-place updates) is visible.
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/NextTrace-android-arm64.apk" \
            | grep -E 'certificate (DN|SHA-256)' || echo "::warning::could not read the APK signer"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NextTrace-android-arm64
          path: NextTrace-android-arm64.apk
          if-no-files-found: error

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          NOTES="Automated build of the Android shell app from \`${GITHUB_REF_NAME}\` @ ${COMMIT_SHA1} (${BUILD_VERSION}, ${BUILD_DATE})."
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" NextTrace-android-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NextTrace Android (latest build)" \
            --notes "$NOTES"
